[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapto-llm"
version = "0.2.1"
description = "Synaptic Weight Eviction engine for dynamic LLM memory consolidation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Bodya" }
]
keywords = ["llm", "memory", "pytorch", "transformers", "plasticity", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "accelerate>=0.28.0",
    "cryptography>=41.0.0"
]

[project.urls]
"Homepage" = "https://github.com/Bodya3101/synapto"
"Repository" = "https://github.com/Bodya3101/synapto"
"Bug Tracker" = "https://github.com/Bodya3101/synapto/issues"